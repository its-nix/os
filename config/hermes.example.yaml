# Safe, non-secret baseline. Copy settings deliberately through
# `hermes config set`; do not copy this file over live config.yaml.
model:
  provider: openai-codex
  # Per-profile values are declared in nix-os.yaml and reconciled by
  # scripts/reconcile-hermes-models.py. LNX/default uses Luna here.
  default: gpt-6-luna
agent:
  tool_use_enforcement: true
  verify_on_stop: true
approvals:
  mode: manual
  cron_mode: deny
security:
  redact_secrets: true
kanban:
  dispatch_in_gateway: true
  max_in_progress: 2
delegation:
  max_concurrent_children: 3
  max_iterations: 50
  max_spawn_depth: 2
display:
  tool_progress: all
  background_process_notifications: all
memory:
  write_approval: true
terminal:
  backend: local
  cwd: "."
# Messaging, identity, and credential settings are intentionally omitted.
# Configure secrets interactively per profile.
