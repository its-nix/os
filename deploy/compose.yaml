name: nixos
services:
  hermes:
    container_name: nixos-hermes
    image: ${HERMES_IMAGE:?Prepare the pinned deployment environment first}
    network_mode: host
    restart: unless-stopped
    command: [gateway, run]
    stop_grace_period: 60s
    mem_limit: 2g
    pids_limit: 1024
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: '18642'
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: '19119'
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/hermes
        target: /opt/data
        bind: {create_host_path: false}
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/knowledge/company
        target: /knowledge/company
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18642/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 4
  t3:
    # Coding cockpit and Hermes coding delegate. Full-access agents run here, so it is
    # isolated from the host-network runtime: own bridge network, loopback-only publish,
    # no Docker socket, no Hermes/Paperclip state, no capabilities, non-root.
    container_name: nixos-t3
    # Built by the deployment from deploy/t3 only when its tag (= Dockerfile hash) is missing, so an
    # unrelated deploy never produces a new image ID and never recreates T3 mid-thread.
    image: nixos-t3:${T3_BUILD_TAG:?Prepare the pinned deployment environment first}
    pull_policy: never
    networks: [coding]
    ports:
      - 127.0.0.1:3773:3773
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    pids_limit: 2048
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/t3/home
        target: /var/lib/t3
        bind: {create_host_path: false}
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/t3/work
        target: /work
        bind: {create_host_path: false}
  hindsight:
    # Long-term memory server for Hermes (PRD 7.4); the Hindsight plugin talks to it in
    # local_external mode, one bank per profile. Separate container, not the plugin's embedded
    # daemon: that daemon would be fetched at runtime (uvx, torch stack) into Hermes's cgroup.
    # Extraction uses its OWN ChatGPT sign-in (hindsight/codex/auth.json, deploy/hindsight/README.md);
    # embeddings run locally (bge-small, baked into the image); reranking is rank fusion (no model).
    # Threat model: banks separate Hermes profiles organizationally, NOT confidentially. All profiles
    # run in nixos-hermes as one uid and can read each other's bank names and this server's API key,
    # so any Hermes profile can address any bank, personal included; hard isolation needs a separate
    # container and uid (out of scope). The API key keeps non-Hermes host processes out; T3 and the
    # reviewer cannot reach this loopback-published port from their own bridge networks.
    # Secrets: the pinned Hermes scrubs every memory hand-off before the plugin sees it (the deploy
    # proves it with deploy/hindsight/redaction_probe.py); the retain mission below is a second layer.
    container_name: nixos-hindsight
    image: ghcr.io/vectorize-io/hindsight-api@sha256:ef1a5ac515a7652fbff605277d44a39e7616e421503c61841189e63ef6db6705  # 1.2.0
    networks: [memory]
    ports:
      - 127.0.0.1:18888:8888
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1536m  # measured: ~710 MiB anonymous after retain+recall; leaves Hermes its own 2g
    cpus: 1.0  # one of two vCPUs at most, so extraction bursts never starve Hermes
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Writable home (database, the server's own Codex login) on the state mount; the embedding
    # model stays in the image's read-only cache, which is why HF_HOME keeps the image's home.
    command: [sh, -c, 'HF_HOME="$$HOME/.cache/huggingface" HOME=/var/lib/hindsight exec /app/start-all.sh']
    env_file:
      - path: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/hindsight.env
        required: true  # HINDSIGHT_API_TENANT_API_KEY, generated once by the deploy (root-only file)
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0  # inside its own network; published on host loopback only
      HINDSIGHT_API_PORT: '8888'
      HINDSIGHT_ENABLE_CP: 'false'
      HINDSIGHT_API_MCP_ENABLED: 'false'
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: 'false'  # missions below are reviewed config, not agent-editable
      # Every bank call needs the key (/health does not); the plugin sends it from each profile's config.
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_ENABLE_BANK_LLM_HEALTH: 'true'  # the founder sign-in's one model check (off by default: 404)
      HINDSIGHT_API_LLM_PROVIDER: openai-codex
      HINDSIGHT_API_LLM_MODEL: gpt-6-luna
      HINDSIGHT_API_LLM_CODEX_HOME: /var/lib/hindsight/codex
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-small-en-v1.5
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_DECISION_MODEL_PROVIDER: none
      HINDSIGHT_API_FILE_PARSER: markitdown
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HINDSIGHT_API_RETAIN_EXTRACTION_MODE: concise
      HINDSIGHT_API_RETAIN_MISSION: >-
        Keep durable observations and decisions: preferences, commitments, decisions and their
        reasons, lessons learned, and stable facts about people, ventures and how work is done.
        Skip small talk and transient status that the CRM, GitHub or task boards already hold.
        Never keep credentials, tokens, passwords or other secrets.
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/hindsight
        target: /var/lib/hindsight
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /app/api/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 240s  # first start initializes Postgres and loads the embedding model on one CPU
      retries: 4
  reviewer:
    # Rotating independent PR reviewer (deploy/reviewer/reviewer.mjs). Same pinned image as T3 but a
    # separate container, network and login home: builders running in T3 cannot reach its logins
    # or its GitHub App key. No ports; outbound only.
    container_name: nixos-reviewer
    image: nixos-t3:${T3_BUILD_TAG:?Prepare the pinned deployment environment first}
    pull_policy: never
    networks: [review]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    pids_limit: 1024
    # The orchestrator runs as root ONLY to hold the root-only App key and selection seed; it spawns
    # every reviewer CLI as uid 10010 (the login user), which cannot read them.
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]  # KILL: stop a timed-out CLI running as another uid
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true  # the T3 image's probe targets port 3773, which the reviewer never serves
    command: [node, /opt/reviewer/reviewer.mjs]
    env_file:
      - path: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/reviewer/reviewer.env
        required: false  # absent => no App id => the reviewer idles and the gate stays closed
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/reviewer/home
        target: /var/lib/t3
        bind: {create_host_path: false}
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/reviewer/app
        target: /opt/reviewer
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/reviewer/secrets
        target: /run/reviewer
        read_only: true
        bind: {create_host_path: false}
  # Optional CRM (PRD 7.2): started only when $NIX_CLEAN_ROOT/twenty/ENABLED exists, i.e. when a
  # venture actually needs one. One platform; ventures get their own workspaces.
  twenty-db:
    profiles: [crm]
    container_name: nixos-twenty-db
    image: postgres@sha256:ce3efec6bc404f6b15ebf5d9bed6b45a9d4655aea238d7dacc3467ccb05a1175  # 16-bookworm
    networks: [crm]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 512m
    env_file:
      - ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/twenty/db.env
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/twenty/db
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U twenty -d default -h localhost]
      interval: 10s
      timeout: 5s
      retries: 10
  twenty-redis:
    profiles: [crm]
    container_name: nixos-twenty-redis
    image: redis@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90  # 7.4-bookworm
    networks: [crm]
    restart: unless-stopped
    mem_limit: 128m
    # Persist BullMQ queues (pending/delayed jobs survive the nightly cold stop and restore).
    command: [--maxmemory-policy, noeviction, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/twenty/redis
        target: /data
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  twenty-server:
    profiles: [crm]
    container_name: nixos-twenty-server
    image: twentycrm/twenty@sha256:251d83ffa37c8916aaa7cd129ddb6829a941b2e2858747479579980d4e8f56a4  # v2.62.0
    networks: [crm]
    ports:
      - 127.0.0.1:3020:3000
    restart: unless-stopped
    stop_grace_period: 120s
    mem_limit: 1536m
    env_file:
      - ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/twenty/server.env
    environment:
      NODE_PORT: '3000'
      SERVER_URL: http://127.0.0.1:3020
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/twenty/storage
        target: /app/packages/twenty-server/.local-storage
        bind: {create_host_path: false}
    depends_on:
      twenty-db: {condition: service_healthy}
      twenty-redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:3000/healthz]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 10
  twenty-worker:
    profiles: [crm]
    container_name: nixos-twenty-worker
    image: twentycrm/twenty@sha256:251d83ffa37c8916aaa7cd129ddb6829a941b2e2858747479579980d4e8f56a4  # v2.62.0
    networks: [crm]
    restart: unless-stopped
    # Node sizes its heap from this limit: 768m gave a ~400 MB heap and the worker died at boot with
    # 'heap out of memory' (128 restarts in an hour, 2026-11-25). Same limit as the server (~856 MB heap).
    mem_limit: 1536m
    command: [yarn, worker:prod]
    env_file:
      - ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/twenty/server.env
    environment:
      SERVER_URL: http://127.0.0.1:3020
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes:
      - type: bind
        source: ${NIX_CLEAN_ROOT:?Prepare a fresh root first}/twenty/storage
        target: /app/packages/twenty-server/.local-storage
        bind: {create_host_path: false}
    depends_on:
      twenty-server: {condition: service_healthy}
networks:
  coding:
    name: nixos-coding
  review:
    name: nixos-review
  memory:
    name: nixos-memory
  crm:
    name: nixos-crm
