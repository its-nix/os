name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Unit tests
        # Load the standard-library runner before adding the repo for application imports.
        run: python3 -I -c 'import sys, unittest; sys.path.append("."); unittest.main(module=None)' discover -s tests -v
      - name: Synthetic Docker recovery canary
        env:
          HERMES_RECOVERY_TEST_IMAGE: python:3.11-slim
        run: python3 -I -c 'import sys, unittest; sys.path.append("."); unittest.main(module=None)' discover -s tests -p test_recovery_container.py -v
      - name: Clean Compose contract
        run: |
          python3 -I - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          versions = json.loads(Path('deploy/versions.json').read_text())
          with TemporaryDirectory(prefix='nix-clean-ci-') as directory:
              root = Path(directory)
              (root / 'hindsight.env').write_text('HINDSIGHT_API_TENANT_API_KEY=' + '0' * 64 + '\n')
              env = dict(os.environ, NIX_CLEAN_ROOT=str(root),
                         HERMES_IMAGE=versions['hermes']['runtime_image'],
                         PAPERCLIP_IMAGE=versions['paperclip']['image'], T3_BUILD_TAG='ci')
              subprocess.run(['docker', 'compose', '-f', 'deploy/compose.yaml', 'config', '--quiet'], env=env, check=True)
              crm = root / 'twenty'
              crm.mkdir()
              for name in ('db.env', 'server.env'):
                  (crm / name).write_text('')
              subprocess.run(['docker', 'compose', '-f', 'deploy/compose.yaml', '--profile', 'crm', 'config', '--quiet'], env=env, check=True)
          PYTHON
      - name: Reviewer service tests
        run: node --test deploy/reviewer/reviewer.test.mjs
      - name: Repository verifier
        run: python3 -I scripts/verify.py
      - name: Bootstrap syntax
        run: |
          bash -n scripts/bootstrap.sh
          sh -n scripts/deploy-os.sh
      - name: Python syntax
        run: python3 -I -m compileall -q scripts tests automation
      - name: Bootstrap preview
        run: HERMES_BIN=/not-installed/hermes bash scripts/bootstrap.sh
      - name: Skill installer interface
        run: python3 -I scripts/install-skills.py --help
      - name: Scout setup preview
        run: HERMES_BIN=/not-installed/hermes python3 -I scripts/setup-skill-scouts.py
      - name: Diff whitespace
        run: git diff --check

  verify:
    runs-on: ubuntu-latest
    needs: evaluate
    if: always()
    permissions: {}
    steps:
      - name: Require every evaluation to pass
        env:
          RESULT: ${{ needs.evaluate.result }}
        run: test "$RESULT" = success

  deploy:
    needs: verify
    if: github.repository == 'its-nix/os' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name)
    runs-on: ubuntu-latest
    environment: vps
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: nix-os-vps
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Deploy verified main through restricted SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" == nixos ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$task_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$task_dir/known_hosts"
          ssh -i "$task_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            -- "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"
          printf 'Deployed %s to the VPS. Native state is preserved.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
