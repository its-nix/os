name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Clean Compose contract
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          versions = json.loads(Path('deploy/versions.json').read_text())
          env = dict(os.environ, NIX_CLEAN_ROOT='/tmp/nix-clean-ci',
                     HERMES_IMAGE=versions['hermes']['image'],
                     PAPERCLIP_IMAGE=versions['paperclip']['image'])
          subprocess.run(['docker', 'compose', '-f', 'deploy/compose.yaml', 'config', '--quiet'], env=env, check=True)
          PYTHON
      - name: Repository verifier
        run: python3 scripts/verify.py
      - name: Bootstrap syntax
        run: |
          bash -n scripts/bootstrap.sh
          sh -n scripts/deploy-os.sh
      - name: Python syntax
        run: python3 -m compileall -q scripts tests automation
      - name: Bootstrap preview
        run: HERMES_BIN=/not-installed/hermes bash scripts/bootstrap.sh
      - name: Skill installer interface
        run: python3 scripts/install-skills.py --help
      - name: Scout setup preview
        run: HERMES_BIN=/not-installed/hermes python3 scripts/setup-skill-scouts.py
      - name: Diff whitespace
        run: git diff --check

  deploy:
    needs: verify
    if: github.repository == 'its-nix/os' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: vps
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: nix-os-vps
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Deploy verified main through restricted SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" == nixops ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$task_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$task_dir/known_hosts"
          ssh -i "$task_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            -- "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"
          printf 'Deployed %s to the VPS. Native state is preserved.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
