name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Synthetic Docker recovery canary
        env:
          HERMES_RECOVERY_TEST_IMAGE: python:3.11-slim
        run: python3 -m unittest discover -s tests -p test_recovery_container.py -v
      - name: Clean Compose contract
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          versions = json.loads(Path('deploy/versions.json').read_text())
          env = dict(os.environ, NIX_CLEAN_ROOT='/tmp/nix-clean-ci',
                     HERMES_IMAGE=versions['hermes']['image'],
                     PAPERCLIP_IMAGE=versions['paperclip']['image'])
          subprocess.run(['docker', 'compose', '-f', 'deploy/compose.yaml', 'config', '--quiet'], env=env, check=True)
          PYTHON
      - name: Repository verifier
        run: python3 scripts/verify.py
      - name: Bootstrap syntax
        run: bash -n scripts/bootstrap.sh
      - name: Python syntax
        run: python3 -m compileall -q scripts tests automation
      - name: Bootstrap preview
        run: HERMES_BIN=/not-installed/hermes bash scripts/bootstrap.sh
      - name: Skill installer interface
        run: python3 scripts/install-skills.py --help
      - name: Scout setup preview
        run: HERMES_BIN=/not-installed/hermes python3 scripts/setup-skill-scouts.py
      - name: Diff whitespace
        run: git diff --check
